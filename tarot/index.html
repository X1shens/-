<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Garden Guidelines - 塔罗占卜</title>
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <div id="app">

    <!-- ========== Welcome Screen ========== -->
    <div id="welcome-screen" class="screen active">
      <div class="starfield"></div>
      <div class="welcome-content">
        <h1 id="welcome-title" class="welcome-title">Garden Guidelines</h1>
        <p id="welcome-subtitle" class="welcome-subtitle">请开启今天的占卜 / Begin Today's Reading</p>
        <button id="btn-start" class="btn btn-primary btn-glow">
          开始占卜 / Start Reading
        </button>
        <button class="btn btn-secondary btn-collection" style="margin-top:12px;">
          图鉴 / Collection
        </button>
      </div>
    </div>

    <!-- ========== Profile Screen ========== -->
    <div id="profile-screen" class="screen">
      <div class="screen-inner">
        <div class="screen-header">
          <button id="btn-profile-back" class="btn-icon" aria-label="Back">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
          </button>
          <span class="section-title" style="margin-bottom:0">个人信息 / Profile</span>
          <button id="btn-profile-skip" class="btn-icon" style="font-size:12px;color:#64748b;width:auto;padding:0 8px;">
            跳过 Skip
          </button>
        </div>
        <div class="profile-container">
          <div class="profile-form">
            <div class="profile-field">
              <label class="profile-label">出生年份 / Birth Year</label>
              <select id="profile-year" class="profile-select">
                <option value="">-- 选择年份 / Select Year --</option>
              </select>
            </div>
            <div class="profile-row">
              <div class="profile-field">
                <label class="profile-label">月份 / Month</label>
                <select id="profile-month" class="profile-select">
                  <option value="">-- 月 / Month --</option>
                </select>
              </div>
              <div class="profile-field">
                <label class="profile-label">日期 / Day</label>
                <select id="profile-day" class="profile-select">
                  <option value="">-- 日 / Day --</option>
                </select>
              </div>
            </div>
            <div class="profile-field">
              <label class="profile-label">出生时辰 / Birth Hour</label>
              <select id="profile-hour" class="profile-select">
                <option value="">-- 选择时辰 / Select Hour --</option>
              </select>
            </div>
            <p class="profile-hint">生辰信息将用于增强占卜的个性化体验<br/>Birth info enhances your personalized reading</p>
            <button id="btn-profile-save" class="btn btn-primary btn-glow" style="margin-top:8px;">
              保存并继续 / Save & Continue
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== Question Screen ========== -->
    <div id="question-screen" class="screen">
      <div class="screen-inner">
        <div class="screen-header">
          <button id="btn-question-back" class="btn-icon" aria-label="Back">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
          </button>
          <div id="count-display" class="count-display"></div>
          <button class="btn-icon btn-collection" aria-label="Collection">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
          </button>
        </div>
        <div class="question-container">
          <h2 class="section-title">你想问什么 / What's Your Question</h2>
          <textarea id="question-input" class="question-input" placeholder="请输入你想占卜的问题...&#10;Enter your question..." rows="4" maxlength="200"></textarea>
          <button id="btn-submit-question" class="btn btn-primary btn-glow">
            开始抽牌 / Draw Cards
          </button>
        </div>
      </div>
    </div>

    <!-- ========== Card Pool Screen ========== -->
    <div id="pool-screen" class="screen">
      <div class="screen-inner pool-inner">
        <div id="shuffle-stage" class="shuffle-stage">
          <div id="deck-area" class="deck-area"></div>
          <p id="shuffle-hint" class="shuffle-hint">点击牌堆开始洗牌<br/>Tap the deck to shuffle</p>
        </div>
        <h2 id="pool-title" class="section-title pool-title">选择三张卡牌 / Choose 3 Cards</h2>
        <div id="selected-count" class="selected-count"></div>
        <div class="ring-viewport" id="ring-viewport">
          <div class="ring-track" id="ring-track"></div>
        </div>
        <p id="ring-hint" class="ring-hint">左右滑动选牌 / Swipe to browse</p>
      </div>
      <div id="confirm-overlay" class="confirm-overlay">
        <div class="confirm-box">
          <h3 class="confirm-title">确认选择 / Confirm Selection</h3>
          <div id="confirm-cards" class="confirm-cards"></div>
          <div class="confirm-actions">
            <button id="btn-confirm-yes" class="btn btn-primary btn-glow">确认抽取 / Confirm Draw</button>
            <button id="btn-confirm-cancel" class="btn btn-secondary">重新选择 / Reselect</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== Reveal Screen ========== -->
    <div id="reveal-screen" class="screen">
      <div class="screen-inner">
        <div id="reveal-cards" class="reveal-row"></div>
        <div id="reading-result" class="reading-result"></div>
        <div id="action-buttons" class="action-buttons">
          <button id="btn-continue" class="btn btn-primary">继续占卜 / Continue</button>
          <button id="btn-exit" class="btn btn-secondary">退出 / Exit</button>
        </div>
      </div>
    </div>

    <!-- ========== Collection Screen (Set List) ========== -->
    <div id="collection-screen" class="screen">
      <div class="screen-inner collection-inner">
        <div class="collection-header">
          <button id="btn-collection-back" class="btn-icon" aria-label="Back">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
          </button>
          <h2 class="section-title">图鉴 / Collection</h2>
        </div>
        <div id="collection-list" class="collection-list"></div>
      </div>
    </div>

    <!-- ========== Collection Detail Screen ========== -->
    <div id="collection-detail-screen" class="screen">
      <div class="screen-inner collection-inner">
        <div class="collection-header">
          <button id="btn-detail-back" class="btn-icon" aria-label="Back">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
          </button>
          <h2 id="detail-title" class="section-title"></h2>
        </div>
        <div id="detail-stats" class="collection-stats"></div>
        <div id="detail-grid" class="detail-grid"></div>
      </div>
    </div>

    <!-- ========== Card Detail Modal ========== -->
    <div id="card-modal" class="modal-overlay">
      <div class="modal-content" id="modal-screenshot-target">
        <button id="btn-close-modal" class="modal-close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
        <div id="modal-card-art" class="modal-card-art"></div>
        <div id="modal-card-info" class="modal-card-info"></div>
        <div class="modal-actions">
          <button id="btn-screenshot" class="btn btn-primary btn-screenshot">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px;">
              <rect x="2" y="6" width="20" height="14" rx="2"/><circle cx="12" cy="13" r="4"/>
              <path d="M8 6V4h8v2"/>
            </svg>
            截图分享 / Screenshot
          </button>
        </div>
        <div id="screenshot-tip" class="screenshot-tip"></div>
      </div>
    </div>

  </div>

  <!-- Error handler for debugging -->
  <script>
  window.onerror = function(msg, url, line, col) {
    var file = url ? url.split('/').pop().split('?')[0] : '?';
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#ef4444;color:#fff;padding:12px 16px;z-index:99999;font-size:13px;cursor:pointer;';
    d.textContent = 'JS Error in ' + file + ':' + line + ' — ' + msg + ' (tap to dismiss)';
    d.onclick = function() { d.parentNode && d.parentNode.removeChild(d); };
    document.body.appendChild(d);
  };
  </script>
  <!-- External: html2canvas for screenshot (async, optional) -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" async defer></script>
  <!-- App scripts -->
  <script src="cards.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
